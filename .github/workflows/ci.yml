---
name: quality

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest tests/unit tests/integration -q

  browser-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Reset and seed isolated demo database
        env:
          INVOICEOPS_DB_PATH: var/local-demo/invoiceops.db
        run: |
          uv run python scripts/bootstrap_local_demo.py --initialize-demo-root
          uv run python scripts/reset_demo.py \
            --demo-root var/local-demo \
            --confirm-reset-local-demo
          test -f "$INVOICEOPS_DB_PATH"

      - name: Start server and run browser smoke
        run: |
          INVOICEOPS_MODE=demo INVOICEOPS_DB_PATH="$INVOICEOPS_DB_PATH" \
            uv run uvicorn invoiceops.legacy.app:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health; then
              INVOICEOPS_MODE=demo INVOICEOPS_DB_PATH="$INVOICEOPS_DB_PATH" \
                uv run python -m invoiceops.automation.bot \
                --invoice-id INV-10023 \
                --base-url http://127.0.0.1:8000 \
                --locator testid
              exit $?
            fi
            sleep 1
          done
          echo "Server did not become healthy within 30 seconds." >&2
          exit 1
        env:
          INVOICEOPS_DB_PATH: var/local-demo/invoiceops.db

      - name: Upload Playwright failure screenshot
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright_failure
          path: artifacts/playwright_failure.png
          if-no-files-found: ignore

  docker-build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Build Docker image
        run: docker build -t invoiceops-ai:ci .

  docker-compose-smoke:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Start Docker Compose stack
        run: docker compose up --build --detach

      - name: Wait for healthy application container
        run: |
          for attempt in {1..30}; do
            container_id="$(docker compose ps --quiet legacy-web)"
            if [ -n "$container_id" ] && [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "legacy-web did not become healthy within 60 seconds." >&2
          exit 1

      - name: Verify Docker Compose endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health
          curl --fail --silent --show-error http://127.0.0.1:8000/login

      - name: Show Docker Compose diagnostics on failure
        if: ${{ failure() }}
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Clean up Docker Compose resources
        if: ${{ always() }}
        run: docker compose down --remove-orphans
